name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:reset
      - run: pnpm db:test
      - name: Check generated database types
        run: pnpm db:types && git diff --exit-code src/db/types.ts
      - name: Build image
        run: |
          eval "$(pnpm exec supabase status -o env | grep '^PUBLISHABLE_KEY=')"
          docker build -t slotly:ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" .
      - name: Start container
        run: |
          docker run -d --name slotly --network host -e SITE_URL=http://slotly.example slotly:ci
          for _ in $(seq 30); do
            curl -fsS --max-time 5 http://127.0.0.1:3000/api/health >/dev/null && exit 0
            [ "$(docker inspect -f '{{.State.Running}}' slotly)" = true ] || break
            sleep 1
          done
          echo "container is not healthy"
          exit 1
      - run: pnpm smoke
      - name: Container logs
        if: ${{ !success() }}
        run: docker logs slotly || true
